name: Deploy FinPath to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: budget-planner/package-lock.json

      - name: Install dependencies
        working-directory: budget-planner
        run: npm ci

      - name: Run lint
        working-directory: budget-planner
        run: npm run lint

      - name: Build app
        working-directory: budget-planner
        run: npm run build

      - name: Add Pages debug file
        run: |
          echo "FinPath GitHub Pages deploy check" > budget-planner/dist/pages-debug.txt
          echo "Built from budget-planner/dist" >> budget-planner/dist/pages-debug.txt
          echo "Base path: /BudgetApp/" >> budget-planner/dist/pages-debug.txt
          echo "Commit: $GITHUB_SHA" >> budget-planner/dist/pages-debug.txt

      - name: Verify build output
        run: |
          echo "Listing dist output"
          ls -la budget-planner/dist
          echo "Checking required files"
          test -f budget-planner/dist/index.html
          test -f budget-planner/dist/manifest.webmanifest
          test -f budget-planner/dist/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: budget-planner/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
